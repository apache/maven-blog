# see https://s.apache.org/asfyaml
publish:
  whoami: maven-blog
  type: blog
github:
  description: "Apache Maven Blog"
  homepage: https://blogs.apache.org/maven/
  labels:
    - apache
    - maven
    - blog
  enabled_merge_buttons:
    squash: true
    merge: false
    rebase: true
  rulesets:
    - name: "Default Branch Protection"
      type: branch
      branches:
        includes:
          - "~DEFAULT_BRANCH"
          - "release/*"
          - "rel/*"
        excludes: []
      bypass_teams:
        - root
      restrict_deletion: true
      restrict_force_push: true
